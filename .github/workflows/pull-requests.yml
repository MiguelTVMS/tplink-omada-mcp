name: Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "tests/**"
      - "*.json"
      - "*.ts"
      - ".github/workflows/*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build and Check Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # Set npm cache to expire after 15 days
          npm_config_cache_max: 1296000

      - name: Build project
        run: npm run build

      - name: Check code style
        run: npm run check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check global branch coverage
        run: |
          BRANCHES=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.branches.pct)")
          echo "Global branch coverage: ${BRANCHES}%"
          node -e "const s=require('./coverage/coverage-summary.json');const pct=s.total.branches.pct;if(pct<70){console.error('Branch coverage '+pct+'% is below 70% threshold');process.exit(1);}else{console.log('Branch coverage OK: '+pct+'%')}"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 15

